<!--
    Office V3 UI — Apple TV
    Joins preserved: 4 = bg toggle, 75 = source select
    Adds D-pad + transport for that retro-noir remote vibe.
-->
<section id="apple-tv-page" class="page-dark" style="height:100vh; display:flex; flex-direction:column; box-sizing:border-box;">

    <div class="v3-pageheader">
        <div>
            <span class="v3-eyebrow">// MEDIA SOURCE</span>
            <div class="v3-title" style="font-size:30px; margin-top:4px;">APPLE TV</div>
            <span class="v3-kana">アップル・ティーヴィー</span>
        </div>
        <div class="v3-eyebrow" style="text-align:right;">DEVICE // TVOS</div>
    </div>

    <!-- Select source -->
    <ch5-button type="text" shape="rectangle" size="xlarge"
        label="ROUTE APPLE TV → DESK"
        iconClass="fab fa-apple" iconPosition="left"
        sendEventOnClick="75"
        customClass="btn-noir primary"
        style="height:84px; font-size:20px; margin-bottom:28px;">
    </ch5-button>

    <!-- D-pad + center select -->
    <div class="v3-eyebrow" style="margin-bottom:12px;">▸ DIRECTIONAL</div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:48px;">

        <!-- D-pad cluster -->
        <div style="display:grid; grid-template-columns:repeat(3, 80px); grid-template-rows:repeat(3, 80px); gap:6px;">
            <div></div>
            <ch5-button type="text" shape="rectangle" label="" iconClass="fas fa-chevron-up" sendEventOnClick="201" customClass="btn-noir" style="height:80px;"></ch5-button>
            <div></div>
            <ch5-button type="text" shape="rectangle" label="" iconClass="fas fa-chevron-left" sendEventOnClick="202" customClass="btn-noir" style="height:80px;"></ch5-button>
            <ch5-button type="text" shape="rectangle" label="OK" sendEventOnClick="200" customClass="btn-noir secondary" style="height:80px; font-size:16px;"></ch5-button>
            <ch5-button type="text" shape="rectangle" label="" iconClass="fas fa-chevron-right" sendEventOnClick="203" customClass="btn-noir" style="height:80px;"></ch5-button>
            <div></div>
            <ch5-button type="text" shape="rectangle" label="" iconClass="fas fa-chevron-down" sendEventOnClick="204" customClass="btn-noir" style="height:80px;"></ch5-button>
            <div></div>
        </div>

        <!-- Side controls -->
        <div style="display:flex; flex-direction:column; gap:10px; min-width:160px;">
            <ch5-button type="text" shape="rectangle" label="MENU" iconClass="fas fa-bars" iconPosition="left" sendEventOnClick="210" customClass="btn-noir" style="height:60px; font-size:13px;"></ch5-button>
            <ch5-button type="text" shape="rectangle" label="HOME" iconClass="fas fa-home" iconPosition="left" sendEventOnClick="211" customClass="btn-noir" style="height:60px; font-size:13px;"></ch5-button>
            <ch5-button type="text" shape="rectangle" label="SIRI" iconClass="fas fa-microphone" iconPosition="left" sendEventOnClick="212" customClass="btn-noir" style="height:60px; font-size:13px;"></ch5-button>
        </div>

    </div>

    <!-- Transport -->
    <div class="v3-eyebrow" style="margin:16px 0 10px;">▸ TRANSPORT</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px;">
        <ch5-button type="text" shape="rectangle" label="PREV" iconClass="fas fa-step-backward" iconPosition="left" sendEventOnClick="220" customClass="btn-noir" style="height:64px; font-size:14px;"></ch5-button>
        <ch5-button type="text" shape="rectangle" label="PLAY / PAUSE" iconClass="fas fa-play" iconPosition="left" sendEventOnClick="221" customClass="btn-noir secondary" style="height:64px; font-size:14px;"></ch5-button>
        <ch5-button type="text" shape="rectangle" label="NEXT" iconClass="fas fa-step-forward" iconPosition="left" sendEventOnClick="222" customClass="btn-noir" style="height:64px; font-size:14px;"></ch5-button>
    </div>

</section>
