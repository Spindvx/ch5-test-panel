<!--
    Office V3 UI — NVX Video Routing
    Joins preserved from v2:
      75/76/77 = TX source select
      90       = Desk RX (active)
      24       = ROUTE confirm
-->
<section id="nvx-control-page" class="page-dark" style="height:100vh; display:flex; flex-direction:column; box-sizing:border-box;">

    <div class="v3-pageheader">
        <div>
            <span class="v3-eyebrow">// VIDEO MATRIX</span>
            <div class="v3-title" style="font-size:30px; margin-top:4px;">NVX ROUTING</div>
            <span class="v3-kana">エヌ・ブイ・エックス</span>
        </div>
        <div class="v3-eyebrow" style="text-align:right; color:var(--neon-mint);">◉ STREAM ACTIVE</div>
    </div>

    <!-- Source grid -->
    <div class="v3-eyebrow" style="margin-bottom:8px;">▸ SOURCES // TX 01–03</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px;">

        <ch5-button
            type="text" shape="rectangle" size="large"
            label="TX 1 // DESK"
            iconClass="fas fa-desktop" iconPosition="top"
            sendEventOnClick="75" receiveStateSelected="75"
            customClass="btn-noir"
            style="height:104px; font-size:13px;">
        </ch5-button>

        <ch5-button
            type="text" shape="rectangle" size="large"
            label="TX 2 // MEETING"
            iconClass="fas fa-video" iconPosition="top"
            sendEventOnClick="76" receiveStateSelected="76"
            customClass="btn-noir"
            style="height:104px; font-size:13px;">
        </ch5-button>

        <ch5-button
            type="text" shape="rectangle" size="large"
            label="TX 3 // LOBBY"
            iconClass="fas fa-video" iconPosition="top"
            sendEventOnClick="77" receiveStateSelected="77"
            customClass="btn-noir"
            style="height:104px; font-size:13px;">
        </ch5-button>

    </div>

    <!-- Destination — clickable, join 90 -->
    <div class="v3-eyebrow" style="margin-bottom:8px;">▸ DESTINATION // RX</div>
    <ch5-button
        type="text" shape="rectangle" size="large"
        label="DESK RX // RECEIVING STREAM"
        iconClass="fas fa-tv" iconPosition="left"
        sendEventOnClick="90" receiveStateSelected="90"
        selected="true"
        customClass="btn-noir"
        style="height:64px; font-size:14px; margin-bottom:24px;">
    </ch5-button>

    <!-- ROUTE confirm -->
    <ch5-button
        type="text" shape="rectangle" size="xlarge"
        label="EXECUTE ROUTE"
        iconClass="fas fa-route" iconPosition="left"
        sendEventOnClick="24"
        customClass="btn-noir primary"
        style="height:84px; font-size:20px; margin-bottom:24px;">
    </ch5-button>

    <!-- Source status feed -->
    <div class="v3-eyebrow" style="margin-bottom:8px;">▸ STATUS FEED</div>
    <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
        <div class="status-row">
            <ch5-jointotext pd-receivestatevalue="75" textalign="left" formatstring="TX.01 // %s"></ch5-jointotext>
        </div>
        <div class="status-row">
            <ch5-jointotext pd-receivestatevalue="76" textalign="left" formatstring="TX.02 // %s"></ch5-jointotext>
        </div>
        <div class="status-row">
            <ch5-jointotext pd-receivestatevalue="77" textalign="left" formatstring="TX.03 // %s"></ch5-jointotext>
        </div>
    </div>

</section>
