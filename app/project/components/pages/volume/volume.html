<!--
    Office V3 UI — Master Volume
    analog 1 = gauge, digital 10 = mute, serial 1 = readout
-->
<section id="volume-page" class="page-dark" style="height:100vh; display:flex; flex-direction:column; box-sizing:border-box;">

    <div class="v3-pageheader">
        <div>
            <span class="v3-eyebrow">// MASTER OUT</span>
            <div class="v3-title" style="font-size:30px; margin-top:4px;">VOLUME</div>
            <span class="v3-kana">マスター・ボリューム</span>
        </div>
        <div class="v3-eyebrow" style="text-align:right;">PROGRAM BUS</div>
    </div>

    <!-- Big readout + gauge -->
    <div class="volume-gauge-container" style="flex:1;">
        <ch5-jointotext pd-receivestatevalue="1" textalign="center" formatstring="%s" customClass="volume-value"></ch5-jointotext>
        <div class="v3-eyebrow" style="margin-top:-16px; margin-bottom:32px; color:var(--neon-cyan); text-shadow:0 0 6px rgba(0,240,255,0.5);">▼ LEVEL ▼</div>

        <ch5-slider
            slidertype="gauge" orientation="horizontal"
            min="0" max="65535" step="1"
            sendEventOnChange="1" pd-receivestatevalue="1"
            style="width:80%; max-width:480px;" tapsettable="true">
        </ch5-slider>

        <div style="margin-top:16px; display:flex; justify-content:space-between; width:80%; max-width:480px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--noir-text-dim); letter-spacing:0.2em;">
            <span>−∞ dB</span>
            <span>0 dB</span>
            <span>+12 dB</span>
        </div>
    </div>

    <!-- Mute -->
    <ch5-button
        type="text" shape="rectangle" size="xlarge"
        label="MUTE OUTPUT"
        iconClass="fas fa-volume-mute" iconPosition="left"
        sendEventOnClick="10" receiveStateSelected="10"
        customClass="btn-noir danger"
        style="height:84px; font-size:20px; margin-top:24px;">
    </ch5-button>

</section>
