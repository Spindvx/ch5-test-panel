<!--
    Office V3 UI — Q-SYS Levels
    Joins preserved:
      analog 25/26/27 = ch1/2/3 fader
      serial 25/26/27 = dB readout
      digital 55–58  = reset / ch select
-->
<section id="qsys-levels-page" class="page-dark" style="height:100vh; display:flex; flex-direction:column; box-sizing:border-box;">

    <div class="v3-pageheader">
        <div>
            <span class="v3-eyebrow">// AUDIO MATRIX</span>
            <div class="v3-title" style="font-size:30px; margin-top:4px;">Q-SYS LEVELS</div>
            <span class="v3-kana">オーディオ・レベル</span>
        </div>
        <div class="v3-eyebrow" style="text-align:right;">SAMPLE 48 kHz / 24 BIT</div>
    </div>

    <div class="v3-eyebrow" style="margin-bottom:12px;">▸ FADERS // 03 CHANNEL</div>

    <!-- Fader strips -->
    <div style="display:flex; gap:18px; justify-content:center; flex:1; align-items:stretch;">

        <div class="fader-strip" style="flex:1; max-width:200px;">
            <label>CH 01</label>
            <ch5-slider slidertype="fader" orientation="vertical"
                min="0" max="65535" step="1"
                sendEventOnChange="25" pd-receivestatevalue="25"
                style="height:280px;" tapsettable="true">
            </ch5-slider>
            <ch5-jointotext pd-receivestatevalue="25" textalign="center" formatstring="%s dB" customClass="fader-value"></ch5-jointotext>
        </div>

        <div class="fader-strip" style="flex:1; max-width:200px;">
            <label>CH 02</label>
            <ch5-slider slidertype="fader" orientation="vertical"
                min="0" max="65535" step="1"
                sendEventOnChange="26" pd-receivestatevalue="26"
                style="height:280px;" tapsettable="true">
            </ch5-slider>
            <ch5-jointotext pd-receivestatevalue="26" textalign="center" formatstring="%s dB" customClass="fader-value"></ch5-jointotext>
        </div>

        <div class="fader-strip" style="flex:1; max-width:200px;">
            <label>CH 03</label>
            <ch5-slider slidertype="fader" orientation="vertical"
                min="0" max="65535" step="1"
                sendEventOnChange="27" pd-receivestatevalue="27"
                style="height:280px;" tapsettable="true">
            </ch5-slider>
            <ch5-jointotext pd-receivestatevalue="27" textalign="center" formatstring="%s dB" customClass="fader-value"></ch5-jointotext>
        </div>

    </div>

    <!-- Channel control row -->
    <div class="v3-eyebrow" style="margin:20px 0 10px;">▸ CONTROL</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
        <ch5-button type="text" shape="rectangle" size="large"
            label="RESET ALL" iconClass="fas fa-undo" iconPosition="left"
            sendEventOnClick="55"
            customClass="btn-noir secondary"
            style="height:64px;"></ch5-button>
        <ch5-button type="text" shape="rectangle" size="large"
            label="CH 01"
            sendEventOnClick="56" receiveStateSelected="56"
            customClass="btn-noir"
            style="height:64px;"></ch5-button>
        <ch5-button type="text" shape="rectangle" size="large"
            label="CH 02"
            sendEventOnClick="57" receiveStateSelected="57"
            customClass="btn-noir"
            style="height:64px;"></ch5-button>
        <ch5-button type="text" shape="rectangle" size="large"
            label="CH 03"
            sendEventOnClick="58" receiveStateSelected="58"
            customClass="btn-noir"
            style="height:64px;"></ch5-button>
    </div>

</section>
