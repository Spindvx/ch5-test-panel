<!--
    Office V3 UI — Clock
    Big neon clock + date.
-->
<section id="clock-page" class="page-dark" style="height:100vh; display:flex; flex-direction:column; box-sizing:border-box;">

    <div class="v3-pageheader">
        <div>
            <span class="v3-eyebrow">// CHRONOS</span>
            <div class="v3-title" style="font-size:30px; margin-top:4px;">SYSTEM TIME</div>
            <span class="v3-kana">深夜の時計</span>
        </div>
        <div class="v3-eyebrow" style="text-align:right; color:var(--neon-mint);">◉ NTP SYNCED</div>
    </div>

    <!-- Centered hero clock -->
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; position:relative;">

        <!-- Decorative bracket frame -->
        <div style="position:relative; padding:48px 64px; border:1px solid var(--noir-line); border-radius:4px; background:linear-gradient(180deg, rgba(20,20,22,0.4) 0%, rgba(8,8,10,0.4) 100%); box-shadow: inset 0 0 60px rgba(255,46,159,0.05);">
            <!-- corner brackets -->
            <span style="position:absolute; top:-1px; left:-1px; width:18px; height:18px; border:1px solid var(--neon-magenta); border-right:none; border-bottom:none; box-shadow:0 0 8px var(--neon-magenta);"></span>
            <span style="position:absolute; top:-1px; right:-1px; width:18px; height:18px; border:1px solid var(--neon-cyan); border-left:none; border-bottom:none; box-shadow:0 0 8px var(--neon-cyan);"></span>
            <span style="position:absolute; bottom:-1px; left:-1px; width:18px; height:18px; border:1px solid var(--neon-cyan); border-right:none; border-top:none; box-shadow:0 0 8px var(--neon-cyan);"></span>
            <span style="position:absolute; bottom:-1px; right:-1px; width:18px; height:18px; border:1px solid var(--neon-magenta); border-left:none; border-top:none; box-shadow:0 0 8px var(--neon-magenta);"></span>

            <ch5-datetime timeformat="hh:mm:ss" customClass="clock-display"></ch5-datetime>
        </div>

        <ch5-datetime format="dddd, MMMM DD, yyyy" customClass="clock-date"></ch5-datetime>

        <div class="v3-eyebrow" style="margin-top:8px;">TIMEZONE // LOCAL · 24H DRIFT &lt; 1ms</div>
    </div>

</section>
